<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mikias Dagem — Forward Deployed Engineer · Data Scientist · AI Architect</title>
  <meta name="description" content="Mikias Dagem — building production-grade AI systems from research to reality. Forward Deployed Engineer, Data Scientist, AI Architect at 10 Academy."/>
  <meta property="og:title" content="Mikias Dagem"/>
  <meta property="og:description" content="Building production-grade AI systems that survive Monday mornings."/>
  <meta property="og:type" content="website"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=Bebas+Neue&family=Cabinet+Grotesk:wght@300;400;500;700;800&display=swap" rel="stylesheet"/>
  <style>
    /* ═══════════════════════════════════════════════
       ROOT & RESET
    ═══════════════════════════════════════════════ */
    :root {
      --bg: #080810;
      --surface: #0d0d18;
      --card: #111120;
      --card-hover: #161628;
      --border: rgba(255,255,255,0.06);
      --border-bright: rgba(255,255,255,0.12);
      --accent: #7DF9C2;
      --accent2: #5B8EFF;
      --accent3: #FF6B6B;
      --amber: #FFB86C;
      --purple: #C084FC;
      --text: rgba(255,255,255,0.88);
      --muted: rgba(255,255,255,0.38);
      --faint: rgba(255,255,255,0.1);
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Cabinet Grotesk', sans-serif;
      --font-mono: 'DM Mono', monospace;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* Grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.4;
    }

    /* ═══════════════════════════════════════════════
       SCROLLBAR
    ═══════════════════════════════════════════════ */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: rgba(125,249,194,0.3); border-radius: 2px; }

    /* ═══════════════════════════════════════════════
       NAV
    ═══════════════════════════════════════════════ */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 0 48px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(8,8,16,0.85);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      transition: border-color 0.3s;
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 22px;
      letter-spacing: 0.08em;
      color: #fff;
      text-decoration: none;
    }
    .nav-logo span { color: var(--accent); }
    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover { color: var(--accent); }
    .nav-cta {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      border: 1px solid rgba(125,249,194,0.35);
      padding: 7px 16px;
      border-radius: 2px;
      text-decoration: none;
      transition: background 0.2s, color 0.2s;
    }
    .nav-cta:hover { background: var(--accent); color: var(--bg); }

    /* Hamburger */
    .nav-burger {
      display: none;
      flex-direction: column;
      gap: 5px;
      cursor: pointer;
      padding: 4px;
    }
    .nav-burger span {
      display: block;
      width: 24px; height: 1.5px;
      background: var(--muted);
      transition: 0.3s;
    }

    /* ═══════════════════════════════════════════════
       HERO
    ═══════════════════════════════════════════════ */
    #hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 0 48px 80px;
      position: relative;
      overflow: hidden;
    }

    /* Background mesh */
    .hero-mesh {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .hero-mesh::before {
      content: '';
      position: absolute;
      top: -20%; right: -10%;
      width: 700px; height: 700px;
      background: radial-gradient(circle, rgba(91,142,255,0.10) 0%, transparent 65%);
    }
    .hero-mesh::after {
      content: '';
      position: absolute;
      bottom: -10%; left: 5%;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(125,249,194,0.07) 0%, transparent 65%);
    }

    /* Decorative vertical line */
    .hero-line {
      position: absolute;
      left: 48px; top: 60px; bottom: 0;
      width: 1px;
      background: linear-gradient(to bottom, transparent, var(--border) 30%, var(--border) 70%, transparent);
    }

    .hero-inner {
      position: relative;
      max-width: 1100px;
      padding-left: 32px;
    }

    .hero-eyebrow {
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      gap: 14px;
      opacity: 0;
      transform: translateY(16px);
      animation: fadeUp 0.7s 0.2s forwards;
    }
    .hero-eyebrow::before {
      content: '';
      width: 32px; height: 1px;
      background: var(--accent);
      flex-shrink: 0;
    }

    .hero-name {
      font-family: var(--font-display);
      font-size: clamp(72px, 12vw, 160px);
      line-height: 0.88;
      letter-spacing: 0.02em;
      color: #fff;
      margin-bottom: 0;
      opacity: 0;
      transform: translateY(24px);
      animation: fadeUp 0.8s 0.35s forwards;
    }
    .hero-name-last {
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255,255,255,0.25);
      display: block;
    }

    .hero-meta {
      margin-top: 36px;
      display: flex;
      align-items: flex-start;
      gap: 48px;
      flex-wrap: wrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s 0.55s forwards;
    }
    .hero-desc {
      max-width: 480px;
      font-size: 16px;
      font-weight: 300;
      line-height: 1.75;
      color: rgba(255,255,255,0.5);
      border-left: 2px solid var(--accent2);
      padding-left: 20px;
    }
    .hero-desc strong { color: rgba(255,255,255,0.85); font-weight: 500; }

    .hero-stats {
      display: flex;
      gap: 36px;
    }
    .hero-stat-item { text-align: left; }
    .hero-stat-num {
      font-family: var(--font-display);
      font-size: 42px;
      line-height: 1;
      color: #fff;
    }
    .hero-stat-num span { color: var(--accent); }
    .hero-stat-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }

    .hero-badges {
      margin-top: 40px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      opacity: 0;
      animation: fadeUp 0.8s 0.75s forwards;
    }
    .badge {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.08em;
      padding: 5px 14px;
      border-radius: 2px;
      border: 1px solid;
      transition: transform 0.15s;
    }
    .badge:hover { transform: translateY(-1px); }
    .bg  { color: var(--accent);  border-color: rgba(125,249,194,0.3); background: rgba(125,249,194,0.05); }
    .bb  { color: var(--accent2); border-color: rgba(91,142,255,0.3);  background: rgba(91,142,255,0.05); }
    .br  { color: var(--accent3); border-color: rgba(255,107,107,0.3); background: rgba(255,107,107,0.05); }
    .ba  { color: var(--amber);   border-color: rgba(255,184,108,0.3); background: rgba(255,184,108,0.05); }
    .bm  { color: var(--muted);   border-color: var(--border);         background: rgba(255,255,255,0.02); }

    .scroll-hint {
      position: absolute;
      bottom: 32px; right: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeIn 1s 1.4s forwards;
    }
    .scroll-arrow {
      width: 28px; height: 28px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: bounce 2s infinite;
    }
    @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(4px); } }

    /* Avatar */
    .hero-avatar {
      position: absolute;
      right: 80px;
      bottom: 80px;
      width: 180px; height: 180px;
      border-radius: 4px;
      background: var(--card);
      border: 1px solid var(--border-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      opacity: 0;
      animation: fadeIn 1s 0.9s forwards;
    }
    .avatar-initials {
      font-family: var(--font-display);
      font-size: 64px;
      letter-spacing: 0.05em;
      color: transparent;
      -webkit-text-stroke: 1px rgba(125,249,194,0.5);
      user-select: none;
    }
    .avatar-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, rgba(125,249,194,0.06), transparent 70%);
    }

    /* ═══════════════════════════════════════════════
       SHARED LAYOUT
    ═══════════════════════════════════════════════ */
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 48px;
    }

    section { padding: 100px 0; }

    .section-label {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .section-heading {
      font-family: var(--font-display);
      font-size: clamp(40px, 6vw, 72px);
      line-height: 0.92;
      color: #fff;
      letter-spacing: 0.02em;
      margin-bottom: 48px;
    }
    .section-heading span { color: var(--accent2); }

    /* Reveal animation */
    .reveal {
      opacity: 0;
      transform: translateY(28px);
      transition: opacity 0.7s ease, transform 0.7s ease;
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ═══════════════════════════════════════════════
       ABOUT
    ═══════════════════════════════════════════════ */
    #about { border-top: 1px solid var(--border); }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 64px;
      align-items: start;
    }
    .about-text {
      font-size: 17px;
      line-height: 1.85;
      color: rgba(255,255,255,0.6);
      font-weight: 300;
    }
    .about-text strong { color: rgba(255,255,255,0.92); font-weight: 500; }
    .about-text p + p { margin-top: 20px; }

    .about-facts {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .fact-row {
      background: var(--card);
      padding: 18px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      transition: background 0.15s;
    }
    .fact-row:hover { background: var(--card-hover); }
    .fact-key {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .fact-val {
      font-size: 13px;
      color: var(--text);
      font-weight: 500;
      text-align: right;
    }
    .fact-val.green { color: var(--accent); }

    /* ═══════════════════════════════════════════════
       STACK
    ═══════════════════════════════════════════════ */
    #stack { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

    .stack-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .stack-cell {
      background: var(--card);
      padding: 28px 24px;
      transition: background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .stack-cell::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .stack-cell:hover { background: var(--card-hover); }
    .stack-cell:hover::before { opacity: 1; }
    .sc-blue::before  { background: linear-gradient(90deg, var(--accent2), transparent); }
    .sc-green::before { background: linear-gradient(90deg, var(--accent), transparent); }
    .sc-amber::before { background: linear-gradient(90deg, var(--amber), transparent); }
    .sc-red::before   { background: linear-gradient(90deg, var(--accent3), transparent); }
    .sc-purple::before{ background: linear-gradient(90deg, var(--purple), transparent); }

    .stack-cat {
      font-family: var(--font-mono);
      font-size: 9px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .stack-items { display: flex; flex-direction: column; gap: 10px; }
    .stack-item {
      font-size: 14px;
      color: rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 400;
    }
    .sdot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
    .dg { background: var(--accent); }
    .db { background: var(--accent2); }
    .dr { background: var(--accent3); }
    .da { background: var(--amber); }
    .dp { background: var(--purple); }

    /* ═══════════════════════════════════════════════
       PROJECTS
    ═══════════════════════════════════════════════ */
    #projects { border-top: 1px solid var(--border); }

    .projects-list {
      display: flex;
      flex-direction: column;
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .project-row {
      background: var(--card);
      padding: 28px 32px;
      display: grid;
      grid-template-columns: 44px 1fr auto;
      align-items: start;
      gap: 20px;
      text-decoration: none;
      transition: background 0.15s;
      position: relative;
      overflow: hidden;
    }
    .project-row::after {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 2px;
      background: var(--accent2);
      transform: scaleY(0);
      transform-origin: bottom;
      transition: transform 0.25s ease;
    }
    .project-row:hover { background: var(--card-hover); }
    .project-row:hover::after { transform: scaleY(1); }

    .pnum {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      padding-top: 3px;
    }
    .pname {
      font-family: var(--font-body);
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    .pdesc {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.65;
      max-width: 580px;
    }
    .ptags {
      display: flex;
      gap: 6px;
      margin-top: 14px;
      flex-wrap: wrap;
    }
    .ptag {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.05em;
      color: var(--muted);
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 3px 9px;
      border-radius: 1px;
    }
    .pstat {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--accent);
      white-space: nowrap;
      text-align: right;
      padding-top: 3px;
      font-weight: 500;
    }
    .pstat small {
      display: block;
      font-size: 10px;
      color: var(--muted);
      margin-top: 4px;
      font-weight: 300;
    }
    .pstat .arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px; height: 32px;
      border: 1px solid var(--border-bright);
      border-radius: 50%;
      font-size: 14px;
      color: var(--muted);
      transition: border-color 0.2s, color 0.2s, transform 0.2s;
    }
    .project-row:hover .arrow {
      border-color: var(--accent2);
      color: var(--accent2);
      transform: translateX(3px);
    }

    /* ═══════════════════════════════════════════════
       ACHIEVEMENTS
    ═══════════════════════════════════════════════ */
    #achievements { background: var(--surface); border-top: 1px solid var(--border); border-bottom: 1px solid
